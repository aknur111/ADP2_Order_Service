version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  order-db:
    image: postgres:16-alpine
    container_name: order-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 110755
      POSTGRES_DB: order_db
    ports:
      - "5435:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  payment-db:
    image: postgres:16-alpine
    container_name: payment-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 110755
      POSTGRES_DB: payment_db
    ports:
      - "5433:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  notification-db:
    image: postgres:16-alpine
    container_name: notification-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 110755
      POSTGRES_DB: notification_db
    ports:
      - "5434:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: payment-service
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8081"
      GRPC_ADDR: ":50051"
      DB_DSN: "postgres://postgres:110755@payment-db:5432/payment_db?sslmode=disable"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
    ports:
      - "8081:8081"
      - "50051:50051"
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    depends_on:
      order-db:
        condition: service_healthy
      payment-service:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":50052"
      DB_DSN: "postgres://postgres:110755@order-db:5432/order_db?sslmode=disable"
      PAYMENT_GRPC_ADDR: "payment-service:50051"
      HTTP_TIMEOUT_SECONDS: "5"
      STREAM_POLL_INTERVAL_MS: "500"
      REDIS_ADDR: "redis:6379"
      ORDER_CACHE_TTL_SECONDS: "300"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_REQUESTS: "10"
      RATE_LIMIT_WINDOW_SECONDS: "60"
    ports:
      - "8080:8080"
      - "50052:50052"
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_DSN: "postgres://postgres:110755@notification-db:5432/notification_db?sslmode=disable"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      REDIS_ADDR: "redis:6379"
      NOTIFICATION_IDEMPOTENCY_TTL_SECONDS: "86400"
      NOTIFICATION_MAX_RETRIES: "3"
      NOTIFICATION_BACKOFF_BASE_SECONDS: "2"
      PROVIDER_MODE: "SIMULATED"
    restart: unless-stopped

volumes:
  order-db-data:
  payment-db-data:
  notification-db-data:
  rabbitmq-data:
  redis-data:
